name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 测试与静态检查 (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Linux 无头环境运行 Qt 需要的最小系统库
      - name: 安装 Qt 运行库 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff 静态检查
        run: ruff check . --output-format github

      - name: 单元测试 (含解析/几何/检查/报告)
        run: python -m unittest discover -s tests -t . -v

      # 离屏渲染冒烟: 构建全部页面 + 分析 + 导出五种报告
      - name: GUI 离屏冒烟测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_gui.py

      - name: CLI 冒烟测试
        run: |
          python -m dfm version
          python -m dfm checks --no-plugins
          python -m dfm rules list
          python -m dfm info samples/brd_export_sample.json
          python -m dfm analyze samples/brd_export_sample.json --thickness 1.6 \
            --quiet --limit 3 -o ci_out --format excel,html,json,text,svg

      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfm-report-py${{ matrix.python-version }}-${{ matrix.os }}
          path: ci_out/
          if-no-files-found: ignore
